<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praktikum JavaScript</title>
  </head>
  <body>
    <h1>Pengenalan JavaScript</h1>
    <p id="Pesan">Konten awal.</p>

    <hr />

    <!-- 1. Cek Bilangan Genap/Ganjil -->
    <h3>Cek Bilangan Genap / Ganjil</h3>
    <label for="bilangan">Masukkan bilangan bulat: </label>
    <input type="number" id="bilangan" step="1" />
    <button type="button" onclick="cekBilangan()">Periksa</button>
    <p id="hasilBilangan"></p>

    <hr />

    <!-- 2. Ubah Warna Latar -->
    <h3>Ubah Warna Latar Belakang</h3>
    <button type="button" onclick="ubahWarnaLatar('lightgreen')">
      Latar Hijau
    </button>
    <button type="button" onclick="ubahWarnaLatar('white')">Latar Putih</button>
    <button type="button" onclick="ubahWarnaLatar('lightyellow')">
      Latar Kuning
    </button>

    <hr />

    <!-- 3. Daftar Menu Makanan & Total Harga (Poin 10) -->
    <h3>Daftar Menu Makanan</h3>
    <label
      ><input type="checkbox" class="menu" value="5000" /> Ayam Katsu
      Rp5.000</label
    ><br />
    <label
      ><input type="checkbox" class="menu" value="8.000" /> Es Lemon Tea
      Rp8.000</label
    ><br />
    <label
      ><input type="checkbox" class="menu" value="12000" /> Soto Ayam
      Rp12.000</label
    ><br />
    <label
      ><input type="checkbox" class="menu" value="5000" /> Es Teh Manis
      Rp5.000</label
    ><br />
    <label
      ><input type="checkbox" class="menu" value="15000" /> Nasi Goreng Spesial
      Rp15.000</label
    ><br />
    <p>Total: Rp<span id="total">0</span></p>

    <hr />

    <!-- 4. Fitur Sembunyikan/Tampilkan Teks (Eksperimen Poin 11) -->
    <h3>Fitur Sembunyikan Teks</h3>
    <button type="button" onclick="toggleTeks()">
      Sembunyikan / Tampilkan Teks
    </button>
    <p id="teksRahasia">
      Ini adalah elemen teks HTML yang bisa menghilang dan muncul kembali saat
      tombol ditekan!
    </p>

    <script src="script.js"></script>
  </body>
</html>
